[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "oni-strat-m1"
version = "0.1.0"
description = "Mark 1 of ONI Capital's first quantitative trading strategy"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "backtesting==0.3.3",
    "yfinance==0.2.50",
    "pandas>=2.0.0",
    "numpy>=1.26.0",
    "pyyaml>6.0.0",
    "matplotlib>=3.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]

[tool.setuptools]
packages = ["libs"]

[tool.black]
line-length = 100
target-version = ['py39']

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true

