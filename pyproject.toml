# Tooling configuration for the quant-strategy-framework repository.
# The code is a flat set of modules run from the repo root (see README.md); it is not packaged.
# Pytest configuration lives in tests/pytest.ini.

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = [
    ".venv*",
    "data_cache",
    "output",
    "results",
    "logs",
]

[tool.ruff.lint]
# E = pycodestyle errors, F = pyflakes, I = isort
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# Example and script-style files insert the repo root into sys.path before importing project modules.
"examples/*" = ["E402"]
"tests/test_universe_simple.py" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["backtest", "data", "ml", "strategy", "universe", "utils"]
