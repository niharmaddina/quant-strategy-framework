[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    -v
    --tb=short
    --strict-markers
markers =
    fast: Fast tests that don't require network (default)
    slow: Slow tests that may require network
    integration: Integration tests
    network: Tests that require network connection

